<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lafelck</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }
        .container { width: 100%; max-width: 430px; text-align: center; }
        .profile {
            width: 95px; height: 95px; border-radius: 50%;
            background: #151515; border: 2px solid #333;
            margin: 0 auto 18px;
            display: flex; align-items: center; justify-content: center;
            font-size: 38px; font-weight: bold;
        }
        h1 { font-size: 28px; margin-bottom: 7px; }
        .username { color: #888; margin-bottom: 10px; }
        .bio { color: #aaa; font-size: 14px; margin-bottom: 28px; }
        .link {
            display: block; text-decoration: none; color: white;
            background: #111; border: 1px solid #292929;
            padding: 17px; margin: 13px 0; border-radius: 14px;
            font-size: 16px; font-weight: bold; transition: .25s;
        }
        .link:hover {
            background: #1c1c1c; transform: scale(1.02); border-color: #555;
        }
        .icon { margin-right: 8px; }
        footer { color: #555; font-size: 12px; margin-top: 28px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile">L</div>
        <h1>Lafelck</h1>
        <div class="username">@lafelck</div>
        <div class="bio">Tüm bağlantılarım burada.</div>

        <a class="link" href="https://t.me/lafelck" target="_blank" rel="noopener">
            <span class="icon">✈️</span> Telegram
        </a>

        <a class="link" href="https://www.tiktok.com/@lafelck" target="_blank" rel="noopener">
            <span class="icon">🎵</span> TikTok
        </a>

        <a class="link" href="https://wa.me/447536618327" target="_blank" rel="noopener">
            <span class="icon">💬</span> WhatsApp
        </a>

        <footer>© 2026 Lafelck</footer>
    </div>
</body>
</html>
